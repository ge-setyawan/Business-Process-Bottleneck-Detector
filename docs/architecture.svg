<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1060" width="780" height="1060" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif">

  <!-- ── Background ── -->
  <rect width="780" height="1060" fill="#ffffff"/>

  <!-- ══════════════════════════════════════════════
       TITLE BLOCK
  ══════════════════════════════════════════════ -->
  <text x="390" y="38" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2328">Business Process Bottleneck Detector</text>
  <text x="390" y="57" text-anchor="middle" font-size="11.5" fill="#57606a">System Architecture · IBM Hackathon Prototype · Runs Locally</text>
  <line x1="40" y1="68" x2="740" y2="68" stroke="#e5e7eb" stroke-width="1"/>

  <!-- ══════════════════════════════════════════════
       SECTION LABELS (left-side verticals)
  ══════════════════════════════════════════════ -->

  <!-- DATA label -->
  <rect x="18" y="84" width="14" height="102" rx="3" fill="#f0f6ff"/>
  <text x="25" y="87" text-anchor="middle" font-size="9" font-weight="700" fill="#3b82d4" transform="rotate(90,25,87) translate(0,-38)">DATA</text>

  <!-- FRONTEND label -->
  <rect x="18" y="198" width="14" height="398" rx="3" fill="#f0fdf4"/>
  <text x="25" y="201" text-anchor="middle" font-size="9" font-weight="700" fill="#16a34a" transform="rotate(90,25,201) translate(0,-122)">FRONTEND</text>

  <!-- LANGFLOW label -->
  <rect x="18" y="608" width="14" height="220" rx="3" fill="#fdf4ff"/>
  <text x="25" y="611" text-anchor="middle" font-size="9" font-weight="700" fill="#7c3aed" transform="rotate(90,25,611) translate(0,-70)">LANGFLOW</text>

  <!-- AI MODEL label -->
  <rect x="18" y="840" width="14" height="110" rx="3" fill="#fff7ed"/>
  <text x="25" y="843" text-anchor="middle" font-size="9" font-weight="700" fill="#ea580c" transform="rotate(90,25,843) translate(0,-28)">AI MODEL</text>

  <!-- ══════════════════════════════════════════════
       ROW 1 — USER
  ══════════════════════════════════════════════ -->
  <!-- User icon circle -->
  <circle cx="390" cy="105" r="22" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1.5"/>
  <circle cx="390" cy="98" r="8" fill="#57606a"/>
  <path d="M370 120 Q390 110 410 120" fill="#57606a"/>
  <text x="390" y="140" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2328">User</text>
  <text x="390" y="154" text-anchor="middle" font-size="10" fill="#57606a">Uploads CSV · Clicks Analyze Process</text>

  <!-- Arrow down -->
  <line x1="390" y1="162" x2="390" y2="186" stroke="#c8cdd3" stroke-width="1.5"/>
  <polygon points="390,190 385,182 395,182" fill="#c8cdd3"/>

